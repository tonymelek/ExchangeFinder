<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Look up Telstra exchange names, codes, and addresses across Victoria — then open the location in Maps."
    />
    <title>ExchangeFinder — Telstra Exchange Lookup</title>
    <link rel="icon" href="./images/Telstra.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-atlas bg-grid text-ink">
    <div class="relative flex min-h-screen flex-col">
      <header class="animate-rise relative z-10 px-5 pb-2 pt-8 sm:px-8 sm:pt-12">
        <div class="mx-auto flex max-w-3xl flex-col items-center text-center">
          <img
            src="./images/Telstra.png"
            alt="Telstra"
            class="mb-5 h-12 w-auto drop-shadow-sm sm:h-14"
            width="140"
            height="56"
          />
          <p
            class="font-display text-4xl font-semibold tracking-tight text-ink sm:text-5xl md:text-6xl"
          >
            Exchange<span class="text-signal">Finder</span>
          </p>
          <p class="mt-3 max-w-md text-base text-slate/75 sm:text-lg">
            Find Telstra exchange addresses across Victoria — search, then navigate.
          </p>
        </div>
      </header>

      <main class="relative z-10 mx-auto w-full max-w-3xl flex-1 px-5 pb-28 pt-8 sm:px-8">
        <section class="animate-rise-late" aria-label="Search exchanges">
          <label for="input" class="sr-only">Exchange name</label>
          <div
            class="group flex items-center gap-3 rounded-2xl border border-line/80 bg-white/80 px-4 py-3 shadow-[0_12px_40px_-16px_rgba(10,22,40,0.35)] backdrop-blur-md transition focus-within:border-signal focus-within:shadow-[0_16px_48px_-12px_rgba(0,120,232,0.35)] focus-within:ring-2 focus-within:ring-signal/30"
          >
            <svg
              class="h-5 w-5 shrink-0 text-slate/45 transition group-focus-within:text-signal"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input
              type="search"
              id="input"
              autocomplete="off"
              spellcheck="false"
              placeholder="Exchange name (min. 3 characters)"
              class="w-full bg-transparent font-body text-lg text-ink outline-none placeholder:text-slate/40"
            />
          </div>
          <p
            id="findings"
            class="mt-4 min-h-6 text-center text-sm font-semibold tracking-wide text-coral"
            role="status"
            aria-live="polite"
          ></p>
        </section>

        <section class="mt-6" aria-label="Search results">
          <div id="table-container" class="overflow-x-auto"></div>
        </section>
      </main>

      <footer
        class="fixed inset-x-0 bottom-0 z-20 border-t border-line/60 bg-ink/95 px-5 py-3 text-center backdrop-blur-md"
      >
        <p
          class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1 font-body text-sm text-mist/80"
        >
          <span>
            Copyright &copy;
            <a
              class="font-medium text-pulse underline decoration-pulse/40 underline-offset-2 transition hover:text-white hover:decoration-white"
              href="https://meltek.com.au"
              target="_blank"
              rel="noopener noreferrer"
              >Meltek</a
            >
          </span>
          <span class="text-mist/40" aria-hidden="true">·</span>
          <span>
            Designed by
            <a
              class="font-medium text-pulse underline decoration-pulse/40 underline-offset-2 transition hover:text-white hover:decoration-white"
              href="mailto:info@meltek.com.au"
              >Tony Melek</a
            >
          </span>
          <span class="text-mist/40" aria-hidden="true">·</span>
          <a
            class="inline-flex items-center gap-1.5 font-medium text-mist/90 transition hover:text-pulse"
            href="https://buymeacoffee.com/tonnabilv"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg
              class="h-4 w-4 shrink-0"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M20.2 7.2h-1.1V6.4A2.4 2.4 0 0 0 16.7 4H5.3A2.4 2.4 0 0 0 2.9 6.4v8.8A3.6 3.6 0 0 0 6.5 18.8h7.2a3.6 3.6 0 0 0 3.5-2.8h.6A3.4 3.4 0 0 0 21.2 12.6v-2a3.4 3.4 0 0 0-1-3.4ZM5.3 5.6h11.4a.8.8 0 0 1 .8.8v.8H4.5V6.4a.8.8 0 0 1 .8-.8Zm12.7 7a1.8 1.8 0 0 1-1.8 1.8h-.1a3.6 3.6 0 0 0 .1-1V8.8h1a1.8 1.8 0 0 1 1.8 1.8v2Z"
              />
            </svg>
            Buy me a coffee
          </a>
        </p>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
